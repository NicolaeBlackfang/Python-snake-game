name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pygame pyinstaller

      - name: Prepare main script
        shell: pwsh
        run: Copy-Item "Python main code" "main.py"

      - name: Build EXE
        run: >
          pyinstaller
          --onefile
          --windowed
          --name SnakeGame
          --add-data "background.jpg;."
          main.py

      - name: Create release package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item "dist\SnakeGame.exe" "release\SnakeGame.exe"
          if (Test-Path "background.jpg") {
            Copy-Item "background.jpg" "release\background.jpg"
          }

      - name: Upload Windows game
        uses: actions/upload-artifact@v4
        with:
          name: SnakeGame-Windows
          path: release/
